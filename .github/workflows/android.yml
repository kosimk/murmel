name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Also caches Gradle's downloads. We don't use gradle/actions: from v6 its
      # caching is a proprietary component with separate terms of use.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: No INTERNET permission in the merged release manifest
        run: ./gradlew checkReleaseNoInternet --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: murmel-debug-apk
          path: app/build/outputs/apk/debug/*.apk
